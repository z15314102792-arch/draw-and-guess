<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>你画我猜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== 微信浏览器提示层 ====== -->
  <div id="wechat-tip" class="wechat-overlay hidden">
    <div class="wechat-guide">
      <div class="wechat-icon">⚠️</div>
      <h2>请在浏览器中打开</h2>
      <p class="wechat-reason">微信内置浏览器不支持实时通信，无法正常运行游戏</p>
      <div class="wechat-steps">
        <div class="wechat-step">
          <span class="step-num">1</span>
          <span>点击右上角 <strong>「···」</strong></span>
        </div>
        <div class="wechat-step">
          <span class="step-num">2</span>
          <span>选择 <strong>「在浏览器中打开」</strong></span>
        </div>
      </div>
      <button id="wechat-copy-btn" class="btn btn-primary btn-block">📋 复制链接</button>
      <p id="wechat-url" class="wechat-url"></p>
    </div>
  </div>

  <!-- ====== 加入/创建房间页 ====== -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-container">
      <h1 class="logo">🎨 你画我猜</h1>
      <p class="subtitle">和朋友一起画画猜词！</p>

      <div class="form-group">
        <label>你的昵称</label>
        <input id="nickname-input" type="text" placeholder="输入昵称" maxlength="8" autocomplete="off">
      </div>

      <button id="create-room-btn" class="btn btn-primary btn-block">🏠 创建房间</button>

      <div class="divider"><span>或</span></div>

      <div class="form-group">
        <label>输入房间号加入</label>
        <div class="join-row">
          <input id="room-code-input" type="text" placeholder="房间号" maxlength="4" autocomplete="off" style="text-transform: uppercase;">
          <button id="join-room-btn" class="btn btn-secondary">加入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 游戏主界面 ====== -->
  <div id="game-screen" class="screen">

    <!-- 顶部信息栏 -->
    <div id="top-bar">
      <div class="top-left">
        <button id="menu-btn" class="icon-btn" title="菜单">☰</button>
        <span class="room-badge">🏠 <span id="room-code-display"></span></span>
      </div>
      <div class="top-center">
        <span id="round-info"></span>
      </div>
      <div class="top-right">
        <span id="timer-display" class="timer">⏱ 60</span>
      </div>
    </div>

    <!-- 画板区域 -->
    <div id="canvas-area">
      <!-- 画家可见：选词面板 -->
      <div id="word-select-panel" class="hidden">
        <p class="word-select-title">选择一个词来画：</p>
        <div id="word-options"></div>
        <p class="word-select-timer">⏱ <span id="word-select-countdown">15</span>秒</p>
      </div>

      <!-- 提示条 -->
      <div id="word-hint-bar" class="hidden">
        <span id="word-hint-text"></span>
      </div>

      <!-- Canvas -->
      <canvas id="draw-canvas"></canvas>
    </div>

    <!-- 工具栏（画者可见 / 等待时所有人可见） -->
    <div id="toolbar" class="hidden">
      <div class="toolbar-row colors-row">
        <button class="color-btn active" data-color="#000000" style="background:#000000"></button>
        <button class="color-btn" data-color="#E74C3C" style="background:#E74C3C"></button>
        <button class="color-btn" data-color="#E67E22" style="background:#E67E22"></button>
        <button class="color-btn" data-color="#F1C40F" style="background:#F1C40F"></button>
        <button class="color-btn" data-color="#2ECC71" style="background:#2ECC71"></button>
        <button class="color-btn" data-color="#3498DB" style="background:#3498DB"></button>
        <button class="color-btn" data-color="#9B59B6" style="background:#9B59B6"></button>
        <button class="color-btn" data-color="#795548" style="background:#795548"></button>
        <input type="color" id="custom-color" class="custom-color-input" value="#000000" title="自定义颜色">
      </div>
      <div class="toolbar-row tools-row">
        <button id="tool-pen" class="tool-btn active">✏️</button>
        <button id="tool-eraser" class="tool-btn">🧹</button>
        <div class="size-group">
          <button class="size-btn" data-size="1"><span class="size-dot" style="width:3px;height:3px"></span></button>
          <button class="size-btn active" data-size="3"><span class="size-dot" style="width:6px;height:6px"></span></button>
          <button class="size-btn" data-size="6"><span class="size-dot" style="width:10px;height:10px"></span></button>
          <button class="size-btn" data-size="9"><span class="size-dot" style="width:14px;height:14px"></span></button>
          <button class="size-btn" data-size="14"><span class="size-dot" style="width:20px;height:20px"></span></button>
        </div>
        <button id="btn-clear" class="tool-btn danger">✕</button>
      </div>
    </div>

    <!-- 等待房间底栏（可折叠） -->
    <div id="waiting-bar">
      <div class="waiting-bar-collapsed" id="waiting-bar-collapsed">
        <span id="waiting-bar-status">🟢 等待好友加入...</span>
        <span class="waiting-bar-count" id="waiting-bar-count">1人</span>
        <button id="waiting-expand-btn" class="icon-btn-sm">▲</button>
      </div>
      <div class="waiting-bar-expanded hidden" id="waiting-bar-expanded">
        <div class="waiting-expand-header">
          <span class="waiting-title-sm">📢 邀请好友</span>
          <button id="waiting-collapse-btn" class="icon-btn-sm">▼</button>
        </div>
        <div class="room-code-row">
          <span class="room-code-label-sm">房间号</span>
          <span id="room-code-big" class="room-code-value-sm">----</span>
          <button id="copy-room-btn" class="btn btn-sm btn-secondary">📋 复制</button>
        </div>
        <!-- 模式选择器（仅房主可操作） -->
        <div class="mode-selector">
          <div class="mode-options">
            <button class="mode-btn active" data-mode="classic">🎨 经典</button>
            <button class="mode-btn" data-mode="speed">⚡ 快速</button>
            <button class="mode-btn" data-mode="blind">🙈 盲画</button>
          </div>
          <p id="mode-desc" class="mode-desc">经典模式：轮流画词猜词，60秒一回合</p>
        </div>
        <p id="waiting-player-count" class="waiting-count-sm">当前 1 人（至少需要 2 人）</p>
        <p class="waiting-doodle-hint-sm">💡 等待时可以随意涂鸦</p>
        <button id="start-game-btn" class="btn btn-primary btn-block hidden">🎮 开始游戏</button>
      </div>
    </div>

    <!-- 底部操作区（游戏中可见） -->
    <div id="bottom-area">
      <div id="chat-messages"></div>
      <div id="guess-bar" class="hidden">
        <input id="guess-input" type="text" placeholder="输入你猜的词..." maxlength="20" autocomplete="off">
        <button id="send-guess-btn" class="btn btn-primary">发送</button>
      </div>
      <button id="play-again-btn" class="btn btn-primary btn-block hidden">🔄 再来一局</button>
    </div>

    <!-- 侧滑菜单 -->
    <div id="slide-menu" class="slide-menu">
      <div class="slide-menu-header">
        <span>菜单</span>
        <button id="close-menu-btn" class="icon-btn">✕</button>
      </div>
      <div class="slide-menu-body">
        <div class="menu-section-label">玩家 (<span id="menu-player-count">0</span>)</div>
        <ul id="player-list"></ul>
        <div class="menu-divider"></div>
        <button id="btn-back-lobby" class="menu-item">🏠 返回大厅</button>
        <button id="btn-leave-room" class="menu-item danger">🚪 退出房间</button>
      </div>
    </div>
    <div id="menu-overlay" class="menu-overlay hidden"></div>

    <!-- 得分弹窗 -->
    <div id="score-popup" class="overlay hidden">
      <div class="overlay-box score-box">
        <h2 id="score-title"></h2>
        <div id="score-body"></div>
        <button id="score-close-btn" class="btn btn-primary">继续</button>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
