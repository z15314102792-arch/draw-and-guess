<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>你画我猜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== 微信浏览器提示层 ====== -->
  <div id="wechat-tip" class="wechat-overlay hidden">
    <div class="wechat-guide">
      <div class="wechat-icon">⚠️</div>
      <h2>请在浏览器中打开</h2>
      <p class="wechat-reason">微信内置浏览器无法正常运行游戏</p>
      <div class="wechat-steps">
        <div class="wechat-step">
          <span class="step-num">1</span>
          <span>点击右上角 <strong>「···」</strong></span>
        </div>
        <div class="wechat-step">
          <span class="step-num">2</span>
          <span>选择 <strong>「在浏览器中打开」</strong></span>
        </div>
      </div>
      <button id="wechat-copy-btn" class="btn btn-primary btn-block">📋 复制链接，手动粘贴到浏览器</button>
      <p id="wechat-url" class="wechat-url"></p>
      <button id="wechat-got-it" class="btn btn-secondary" style="margin-top:8px;">我已在浏览器中打开</button>
    </div>
  </div>

  <!-- ====== 加入/创建房间页 ====== -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-container">
      <h1 class="logo">🎨 你画我猜</h1>
      <p class="subtitle">和朋友一起画画猜词！</p>

      <div class="form-group">
        <label>你的昵称</label>
        <input id="nickname-input" type="text" placeholder="输入昵称" maxlength="8" autocomplete="off">
      </div>

      <button id="create-room-btn" class="btn btn-primary btn-block">🏠 创建房间</button>

      <div class="divider"><span>或</span></div>

      <div class="form-group">
        <label>输入房间号加入</label>
        <div class="join-row">
          <input id="room-code-input" type="text" placeholder="房间号" maxlength="4" autocomplete="off" style="text-transform: uppercase;">
          <button id="join-room-btn" class="btn btn-secondary">加入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 游戏主界面 ====== -->
  <div id="game-screen" class="screen">

    <!-- 顶部信息栏 -->
    <div id="top-bar">
      <div class="top-left">
        <span class="room-badge">🏠 <span id="room-code-display"></span></span>
      </div>
      <div class="top-center">
        <span id="round-info"></span>
      </div>
      <div class="top-right">
        <span id="timer-display" class="timer">⏱ 60</span>
      </div>
    </div>

    <!-- 画板区域 -->
    <div id="canvas-area">
      <!-- 等待房间面板 -->
      <div id="waiting-panel">
        <div class="waiting-card">
          <p class="waiting-title">📢 邀请好友加入</p>
          <div class="room-code-big">
            <span class="room-code-label">房间号</span>
            <span id="room-code-big" class="room-code-value">----</span>
          </div>
          <div class="waiting-actions">
            <button id="copy-room-btn" class="btn btn-secondary">📋 复制房间号</button>
            <button id="share-room-btn" class="btn btn-primary">📤 分享链接</button>
          </div>
          <p class="waiting-hint">或让朋友在首页输入房间号加入</p>
          <div id="server-url-row" class="server-url-row hidden">
            <span class="server-url-label">📱 访问地址</span>
            <span id="server-url-display" class="server-url-value"></span>
          </div>
          <!-- 模式选择器（仅房主可操作） -->
          <div class="mode-selector">
            <p class="mode-label">🎯 游戏模式</p>
            <div class="mode-options">
              <button class="mode-btn active" data-mode="classic">🎨 经典</button>
              <button class="mode-btn" data-mode="speed">⚡ 快速</button>
              <button class="mode-btn" data-mode="blind">🙈 盲画</button>
            </div>
            <p id="mode-desc" class="mode-desc">经典模式：轮流画词猜词，60秒一回合</p>
          </div>
          <div class="waiting-status">
            <span class="waiting-dot"></span>
            <span id="waiting-status-text">等待好友加入...</span>
          </div>
          <p id="waiting-player-count" class="waiting-count">当前 1 人（至少需要 2 人）</p>
          <p class="waiting-doodle-hint">💡 等待时可以随意涂鸦～</p>
        </div>
      </div>

      <!-- 画家可见：选词面板 -->
      <div id="word-select-panel" class="hidden">
        <p class="word-select-title">选择一个词来画：</p>
        <div id="word-options"></div>
        <p class="word-select-timer">⏱ <span id="word-select-countdown">15</span>秒</p>
      </div>

      <!-- 提示条（猜者可见） -->
      <div id="word-hint-bar" class="hidden">
        <span id="word-hint-text"></span>
      </div>

      <!-- Canvas -->
      <canvas id="draw-canvas"></canvas>

      <!-- 画者工具栏 -->
      <div id="toolbar" class="hidden">
        <div class="toolbar-row colors-row">
          <button class="color-btn active" data-color="#000000" style="background:#000"></button>
          <button class="color-btn" data-color="#E74C3C" style="background:#E74C3C"></button>
          <button class="color-btn" data-color="#3498DB" style="background:#3498DB"></button>
          <button class="color-btn" data-color="#2ECC71" style="background:#2ECC71"></button>
          <button class="color-btn" data-color="#F39C12" style="background:#F39C12"></button>
        </div>
        <div class="toolbar-row tools-row">
          <button id="tool-pen" class="tool-btn active">✏️ 画笔</button>
          <button id="tool-eraser" class="tool-btn">🧹 橡皮</button>
          <div class="size-group">
            <button class="size-btn active" data-size="3">细</button>
            <button class="size-btn" data-size="6">中</button>
            <button class="size-btn" data-size="10">粗</button>
          </div>
          <button id="btn-clear" class="tool-btn danger">✕ 清屏</button>
        </div>
      </div>
    </div>

    <!-- 底部操作区 -->
    <div id="bottom-area">
      <!-- 聊天消息 -->
      <div id="chat-messages"></div>

      <!-- 猜词输入（猜者可见） -->
      <div id="guess-bar" class="hidden">
        <input id="guess-input" type="text" placeholder="输入你猜的词..." maxlength="20" autocomplete="off">
        <button id="send-guess-btn" class="btn btn-primary">发送</button>
      </div>

      <!-- 等待阶段的开始游戏按钮（房主可见） -->
      <button id="start-game-btn" class="btn btn-primary btn-block hidden">🎮 开始游戏 (至少2人)</button>

      <!-- 游戏结束再来一局按钮（房主可见） -->
      <button id="play-again-btn" class="btn btn-primary btn-block hidden">🔄 再来一局</button>
    </div>

    <!-- 玩家列表面板（侧边栏） -->
    <div id="players-panel">
      <div class="panel-header">
        <span>👥 玩家</span>
        <button id="toggle-players-btn" class="icon-btn">✕</button>
      </div>
      <ul id="player-list"></ul>
    </div>

    <!-- 打开玩家列表的浮动按钮 -->
    <button id="show-players-btn" class="fab">👥</button>

    <!-- 得分弹窗 -->
    <div id="score-popup" class="overlay hidden">
      <div class="overlay-box score-box">
        <h2 id="score-title"></h2>
        <div id="score-body"></div>
        <button id="score-close-btn" class="btn btn-primary">继续</button>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
